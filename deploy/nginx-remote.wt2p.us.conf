# /etc/nginx/sites-available/remote.wt2p.us
#
# SSL is handled by Cloudflare (cloudflared tunnel), not by this box directly
# -- no certbot needed here. This nginx block only needs to serve plain HTTP
# on localhost; the tunnel's Public Hostname entry (configured in the
# Cloudflare dashboard) is what maps remote.wt2p.us -> this. See
# deploy/DEPLOY.md step 7.

server {
    listen 80;
    listen [::]:80;
    server_name remote.wt2p.us;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/status is polled every few seconds by the frontend JS --
        # make sure nginx (or any CDN/cache in front of it later) never
        # caches it, or clients will see stale data.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }
}
