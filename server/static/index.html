<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WT2P // Station Status</title>
    <!-- Fira Code Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --body-bg: #0d0d0d;
            --window-bg: #121212;
            --sidebar-bg: #090909;
            --accent-color: #ff9400;
            --accent-hover: #ffaa33;
            --accent-glow: rgba(255, 148, 0, 0.2);
            --accent-dim: #804a00;
            --body-color: #ffaa00;
            --body-color-muted: #cc7a00;
            --border-color: #261a00;
            --highlight-bg: #211500;
            --status-online: #1a7f37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--body-bg);
            color: var(--body-color);
            font-family: "Fira Code", monospace;
            line-height: 1.6;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            min-width: 0;
            max-width: 800px;
            background-color: var(--window-bg);
            border: 1px solid var(--accent-dim);
            box-shadow: 0 0 20px var(--accent-glow);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        header {
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .callsign-title {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.35rem 0.75rem;
        }

        .callsign {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
            text-shadow: 0 0 8px var(--accent-glow);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--body-color-muted);
        }

        .status {
            font-size: 0.8rem;
            color: var(--accent-color);
            border: 1px solid var(--accent-dim);
            padding: 0.25rem 0.5rem;
            border-radius: 2px;
            background: var(--highlight-bg);
        }

        .content {
            padding: 2rem 1.5rem;
        }

        .section {
            margin-bottom: 2rem;
        }
        .section:last-child { margin-bottom: 0; }

        h2 {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 0.25rem;
        }

        .station-name {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.95rem;
            margin: 1rem 0 0.5rem;
        }
        .station-name:first-of-type { margin-top: 0; }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.85rem;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        th {
            background-color: var(--sidebar-bg);
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        td { color: var(--body-color); }
        tr.offline td { color: var(--body-color-muted); font-style: italic; }

        .status-pill {
            font-size: 0.75rem;
            border: 1px solid var(--accent-dim);
            padding: 0.15rem 0.5rem;
            border-radius: 2px;
            background: var(--highlight-bg);
        }
        .status-pill.online { color: var(--status-online); }
        .status-pill.offline { color: var(--body-color-muted); border-color: var(--border-color); }

        .updated {
            color: var(--body-color-muted);
            font-size: 0.78rem;
            margin-top: 1rem;
        }

        .empty-state {
            color: var(--body-color-muted);
            font-size: 0.9rem;
        }

        /* Contest mode: the agent published only the band, not the exact
           frequency. Muted text + a padlock so it reads as "withheld on
           purpose", not "missing" or "offline". */
        .band-masked {
            color: var(--body-color-muted);
            white-space: nowrap;
        }
        .lock-icon {
            vertical-align: -0.15em;
        }

        .legend {
            color: var(--body-color-muted);
            font-size: 0.78rem;
            margin-top: 0.75rem;
        }
        .legend .lock-icon {
            margin-right: 0.15rem;
        }

        .repo-footer {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            background-color: var(--sidebar-bg);
            border-top: 1px solid var(--border-color);
            padding: 0.9rem 1.5rem;
            text-align: center;
            font-size: 0.78rem;
            color: var(--body-color-muted);
        }
        .repo-footer a {
            color: var(--accent-color);
            text-decoration: none;
            overflow-wrap: anywhere;
        }
        .repo-footer a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* --- Mobile: below ~560px the 5-column table won't fit, so each
           radio row becomes a stacked label/value card. --- */
        @media (max-width: 560px) {
            body { padding: 1rem 0.5rem; }
            header { padding: 1rem; }
            .callsign { font-size: 1.6rem; }
            .content { padding: 1.25rem 1rem; }
            .repo-footer { padding: 0.9rem 1rem; }

            /* Let the subtitle drop under the callsign instead of being
               clipped on the same line. */
            .subtitle { flex-basis: 100%; }

            table, tbody, tr, td { display: block; }
            thead { display: none; }
            table { width: 100%; }

            tr {
                border: 1px solid var(--border-color);
                margin-bottom: 0.75rem;
            }
            tr:last-child { margin-bottom: 0; }

            td {
                border: none;
                border-bottom: 1px dashed var(--border-color);
                padding: 0.5rem 0.75rem;
                overflow-wrap: anywhere;
            }
            td:last-child { border-bottom: none; }
            td::before {
                content: attr(data-label);
                display: block;
                margin-bottom: 0.1rem;
                color: var(--accent-color);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                font-size: 0.7rem;
                font-weight: 600;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="callsign-title">
                <span class="callsign">WT2P</span>
                <span class="subtitle">// AMATEUR RADIO &amp; ENGINEERING</span>
            </div>
            <div class="status">Yorkville, IL | Elyria, OH (Remote)</div>
        </header>

        <div class="content">
            <div class="section">
                <h2>Station Status</h2>
                <div id="content">Loading&hellip;</div>
                <div class="updated" id="updated"></div>
            </div>
        </div>

        <footer class="repo-footer">
            <span>Created by <a href="https://wt2p.us" target="_blank" rel="noopener">WT2P</a> &middot; <a href="https://github.com/chibondking/station-status" target="_blank" rel="noopener">GitHub</a></span>
            <span>TCI radio data powered by <a href="https://github.com/aethersdr/AetherSDR" target="_blank" rel="noopener">AetherSDR</a></span>
            <span id="deploy-info" hidden></span>
        </footer>
    </div>

<script>
const POLL_MS = 3000;

function fmtFreq(hz) {
  if (hz === null || hz === undefined) return '\u2014';
  return (hz / 1e6).toFixed(4) + ' MHz';
}

// Feather-style padlock, sized to the surrounding text (1em), inherits
// color via currentColor.
const LOCK_SVG =
  '<svg class="lock-icon" viewBox="0 0 24 24" width="1em" height="1em"' +
  ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"' +
  ' stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="4" y="11" width="16" height="10" rx="2"></rect>' +
  '<path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';

const MASK_TITLE =
  'Contest mode — the shack agent is publishing only the band; ' +
  'the exact frequency never leaves the LAN.';

// When the agent runs in contest mode it sends a band name ("40M") in
// place of the exact frequency (freq_hz is null in that case). Show the
// band behind a padlock so it's clearly a deliberate mask, not a missing
// reading; otherwise show the formatted MHz frequency as normal.
function fmtFreqCell(radio) {
  if (radio.band) {
    return `<span class="band-masked" title="${MASK_TITLE}">` +
           `${LOCK_SVG}&nbsp;${radio.band}</span>`;
  }
  return fmtFreq(radio.freq_hz);
}

function render(data) {
  const content = document.getElementById('content');
  content.innerHTML = '';

  if (!data.stations || data.stations.length === 0) {
    const div = document.createElement('div');
    div.className = 'empty-state';
    div.textContent = 'No stations reporting yet.';
    content.appendChild(div);
    return;
  }

  let anyMasked = false;

  for (const station of data.stations) {
    const heading = document.createElement('div');
    heading.className = 'station-name';
    heading.textContent = station.station_name;
    content.appendChild(heading);

    const table = document.createElement('table');
    table.innerHTML = `
      <thead>
        <tr><th>Radio</th><th>Freq</th><th>Mode</th><th>Operator</th><th>Status</th></tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector('tbody');

    for (const radio of station.radios) {
      if (radio.status === 'online' && radio.band) anyMasked = true;
      const tr = document.createElement('tr');
      tr.className = radio.status; // "online" | "offline"
      tr.innerHTML = `
        <td data-label="Radio">${radio.label}</td>
        <td data-label="Freq">${radio.status === 'online' ? fmtFreqCell(radio) : '\u2014'}</td>
        <td data-label="Mode">${radio.status === 'online' ? (radio.mode || '\u2014') : '\u2014'}</td>
        <td data-label="Operator">${radio.status === 'online' ? (radio.operator || '\u2014') : '\u2014'}</td>
        <td data-label="Status"><span class="status-pill ${radio.status}">${radio.status.toUpperCase()}</span></td>
      `;
      tbody.appendChild(tr);
    }
    content.appendChild(table);
  }

  if (anyMasked) {
    const legend = document.createElement('div');
    legend.className = 'legend';
    legend.innerHTML = LOCK_SVG +
      ' Contest mode &mdash; exact frequency kept on the shack LAN';
    content.appendChild(legend);
  }

  // UTC ("Zulu"), the standard on-air time reference -- HH:MM:SSZ.
  document.getElementById('updated').textContent =
    'Last refreshed: ' + new Date().toISOString().slice(11, 19) + 'Z';
}

async function poll() {
  try {
    const res = await fetch('/api/status', { cache: 'no-store' });
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('content').textContent = 'Error loading status: ' + e;
  }
}

poll();
setInterval(poll, POLL_MS);

// Deploy stamp in the footer -- lets a viewer tell whether they're looking
// at a stale/cached page, since this only changes on an actual redeploy.
// Fetched once; no need to poll it.
fetch('/api/version', { cache: 'no-store' })
  .then((r) => r.json())
  .then((v) => {
    if (!v || !v.deployedAt) return;
    const el = document.getElementById('deploy-info');
    const when = new Date(v.deployedAt).toLocaleString();
    el.textContent = 'deployed ' + when + (v.commit ? ' (' + v.commit + ')' : '');
    el.hidden = false;
  })
  .catch(() => {});
</script>
</body>
</html>
