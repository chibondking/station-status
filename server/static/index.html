<!DOCTYPE html>
<html lang="en">
<!-- station-status: what's on the air at WT2P right now.

     Three files since 2026-10-15, where there used to be one 589-line
     page: this markup, style.css for the look, app.js for the live
     data. Finding the word a visitor reads no longer means scrolling
     past 320 lines of CSS to reach a template literal -- every label is
     at the top of app.js.

     ?v= on the two assets busts Cloudflare's edge cache, which caches
     .css and .js by extension for hours whatever we send. Bump the
     number when you change that file, or a deploy can take hours to
     show up (the same convention the ops dashboard uses). -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WT2P // Station Status</title>
    <!-- Fira Code Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <div class="container">
        <header>
            <div class="callsign-title">
                <span class="callsign">WT2P</span>
                <span class="subtitle">// AMATEUR RADIO &amp; ENGINEERING</span>
            </div>
            <div class="status">Yorkville, IL | Elyria, OH (Remote)</div>
        </header>

        <div class="content">
            <div class="section">
                <h2>Station Status</h2>
                <!-- Filled by app.js on every poll; the text here is
                     what a visitor sees for the first few hundred ms. -->
                <div id="content">Loading&hellip;</div>
                <div class="updated" id="updated"></div>
            </div>
        </div>

        <footer class="repo-footer">
            <span>Created by <a href="https://wt2p.us" target="_blank" rel="noopener">WT2P</a> &middot; <a href="https://github.com/chibondking/station-status" target="_blank" rel="noopener">GitHub</a></span>
            <span>TCI radio data powered by <a href="https://github.com/aethersdr/AetherSDR" target="_blank" rel="noopener">AetherSDR</a></span>
            <span id="deploy-info" hidden></span>
        </footer>
    </div>

<script src="app.js?v=1"></script>
</body>
</html>
