<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WT2P // Station Status</title>
    <!-- Fira Code Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --body-bg: #0d0d0d;
            --window-bg: #121212;
            --sidebar-bg: #090909;
            --accent-color: #ff9400;
            --accent-hover: #ffaa33;
            --accent-glow: rgba(255, 148, 0, 0.2);
            --accent-dim: #804a00;
            --body-color: #ffaa00;
            --body-color-muted: #cc7a00;
            --border-color: #261a00;
            --highlight-bg: #211500;
            --status-online: #1a7f37;
            /* Transmit. Red, not another shade of the page's amber: this is
               the one state that has to be readable at a glance from across
               the shack, and amber-on-amber isn't. */
            --status-tx: #ff3b30;
            --status-tx-glow: rgba(255, 59, 48, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--body-bg);
            color: var(--body-color);
            font-family: "Fira Code", monospace;
            line-height: 1.6;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            min-width: 0;
            max-width: 800px;
            background-color: var(--window-bg);
            border: 1px solid var(--accent-dim);
            box-shadow: 0 0 20px var(--accent-glow);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        header {
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .callsign-title {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.35rem 0.75rem;
        }

        .callsign {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
            text-shadow: 0 0 8px var(--accent-glow);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--body-color-muted);
        }

        .status {
            font-size: 0.8rem;
            color: var(--accent-color);
            border: 1px solid var(--accent-dim);
            padding: 0.25rem 0.5rem;
            border-radius: 2px;
            background: var(--highlight-bg);
        }

        .content {
            padding: 2rem 1.5rem;
        }

        .section {
            margin-bottom: 2rem;
        }
        .section:last-child { margin-bottom: 0; }

        h2 {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 0.25rem;
        }

        .station-name {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.95rem;
            margin: 1rem 0 0.5rem;
        }
        .station-name:first-of-type { margin-top: 0; }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.85rem;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        th {
            background-color: var(--sidebar-bg);
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        td { color: var(--body-color); }
        tr.offline td { color: var(--body-color-muted); font-style: italic; }

        .status-pill {
            font-size: 0.75rem;
            border: 1px solid var(--accent-dim);
            padding: 0.15rem 0.5rem;
            border-radius: 2px;
            background: var(--highlight-bg);
        }
        .status-pill.online { color: var(--status-online); }
        .status-pill.offline { color: var(--body-color-muted); border-color: var(--border-color); }

        /* Where the reading comes from: "TCI" for a direct radio link,
           "Logger" for an N1MM/DXLog feed off the shack LAN. */
        .source-tag {
            margin-left: 0.4rem;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--body-color-muted);
        }

        /* [TX] -- this radio is keyed right now. TCI only: it's the one
           source that reports transmit state directly (trx:), so the chip
           appearing is itself a statement that the reading is live off the
           radio, not inferred from a logger broadcast. Sits beside the
           radio's name because that's what you're looking at when you want
           to know "can I key up?". */
        .tx-chip {
            display: inline-block;
            margin-left: 0.5rem;
            padding: 0 0.35rem;
            border: 1px solid var(--status-tx);
            border-radius: 2px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.5;
            color: var(--status-tx);
            background: rgba(255, 59, 48, 0.12);
            text-shadow: 0 0 6px var(--status-tx-glow);
            vertical-align: 0.05em;
            white-space: nowrap;
            animation: tx-pulse 1.4s ease-in-out infinite;
        }

        @keyframes tx-pulse {
            50% {
                border-color: var(--status-tx-glow);
                box-shadow: 0 0 8px var(--status-tx-glow);
            }
        }

        /* A pulsing element is exactly what a vestibular/motion-sensitivity
           setting is asking us to stop doing. The chip's colour and border
           already carry the whole message, so dropping the animation loses
           nothing. */
        @media (prefers-reduced-motion: reduce) {
            .tx-chip { animation: none; }
        }

        /* "Last station worked" -- one line under a station's radios, fed
           by an ADIF record per QSO from the logger (QRZero). Sits below
           the table, quieter than the radio rows: it's context, not the
           live state the page exists for. */
        .last-worked {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.5rem 0 0;
            padding: 0.4rem 0.6rem;
            border: 1px dashed var(--border-color);
            border-radius: 3px;
            font-size: 0.8rem;
            color: var(--body-color-muted);
        }
        .last-worked .lw-call {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        .last-worked .lw-band,
        .last-worked .lw-mode { color: var(--body-color); }
        .last-worked .lw-when { margin-left: auto; }
        @media (max-width: 560px) {
            .last-worked .lw-when { margin-left: 0; }
        }

        .updated {
            color: var(--body-color-muted);
            font-size: 0.78rem;
            margin-top: 1rem;
        }

        .empty-state {
            color: var(--body-color-muted);
            font-size: 0.9rem;
        }

        /* Contest mode: the agent published only the band, not the exact
           frequency. Muted text + a padlock so it reads as "withheld on
           purpose", not "missing" or "offline". */
        .band-masked {
            color: var(--body-color-muted);
            white-space: nowrap;
        }
        .lock-icon {
            vertical-align: -0.15em;
        }

        .legend {
            color: var(--body-color-muted);
            font-size: 0.78rem;
            margin-top: 0.75rem;
        }
        .legend .lock-icon {
            margin-right: 0.15rem;
        }

        .repo-footer {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            background-color: var(--sidebar-bg);
            border-top: 1px solid var(--border-color);
            padding: 0.9rem 1.5rem;
            text-align: center;
            font-size: 0.78rem;
            color: var(--body-color-muted);
        }
        .repo-footer a {
            color: var(--accent-color);
            text-decoration: none;
            overflow-wrap: anywhere;
        }
        .repo-footer a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* --- Mobile: below ~560px the 5-column table won't fit, so each
           radio row becomes a stacked label/value card. --- */
        @media (max-width: 560px) {
            body { padding: 1rem 0.5rem; }
            header { padding: 1rem; }
            .callsign { font-size: 1.6rem; }
            .content { padding: 1.25rem 1rem; }
            .repo-footer { padding: 0.9rem 1rem; }

            /* Let the subtitle drop under the callsign instead of being
               clipped on the same line. */
            .subtitle { flex-basis: 100%; }

            table, tbody, tr, td { display: block; }
            thead { display: none; }
            table { width: 100%; }

            tr {
                border: 1px solid var(--border-color);
                margin-bottom: 0.75rem;
            }
            tr:last-child { margin-bottom: 0; }

            td {
                border: none;
                border-bottom: 1px dashed var(--border-color);
                padding: 0.5rem 0.75rem;
                overflow-wrap: anywhere;
            }
            td:last-child { border-bottom: none; }
            td::before {
                content: attr(data-label);
                display: block;
                margin-bottom: 0.1rem;
                color: var(--accent-color);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                font-size: 0.7rem;
                font-weight: 600;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="callsign-title">
                <span class="callsign">WT2P</span>
                <span class="subtitle">// AMATEUR RADIO &amp; ENGINEERING</span>
            </div>
            <div class="status">Yorkville, IL | Elyria, OH (Remote)</div>
        </header>

        <div class="content">
            <div class="section">
                <h2>Station Status</h2>
                <div id="content">Loading&hellip;</div>
                <div class="updated" id="updated"></div>
            </div>
        </div>

        <footer class="repo-footer">
            <span>Created by <a href="https://wt2p.us" target="_blank" rel="noopener">WT2P</a> &middot; <a href="https://github.com/chibondking/station-status" target="_blank" rel="noopener">GitHub</a></span>
            <span>TCI radio data powered by <a href="https://github.com/aethersdr/AetherSDR" target="_blank" rel="noopener">AetherSDR</a></span>
            <span id="deploy-info" hidden></span>
        </footer>
    </div>

<script>
const POLL_MS = 3000;

function fmtFreq(hz) {
  if (hz === null || hz === undefined) return '\u2014';
  return (hz / 1e6).toFixed(4) + ' MHz';
}

// Feather-style padlock, sized to the surrounding text (1em), inherits
// color via currentColor.
const LOCK_SVG =
  '<svg class="lock-icon" viewBox="0 0 24 24" width="1em" height="1em"' +
  ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"' +
  ' stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="4" y="11" width="16" height="10" rx="2"></rect>' +
  '<path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';

const MASK_TITLE =
  'Contest mode — the shack agent is publishing only the band; ' +
  'the exact frequency never leaves the LAN.';

// When the agent runs in contest mode it sends a band name ("40M") in
// place of the exact frequency (freq_hz is null in that case). Show the
// band behind a padlock so it's clearly a deliberate mask, not a missing
// reading; otherwise show the formatted MHz frequency as normal.
function fmtFreqCell(radio) {
  if (radio.band) {
    return `<span class="band-masked" title="${MASK_TITLE}">` +
           `${LOCK_SVG}&nbsp;${radio.band}</span>`;
  }
  return fmtFreq(radio.freq_hz);
}

// Small tag shown next to ONLINE/OFFLINE: "TCI" for a direct radio
// connection, "Logger" for an N1MM/DXLog feed. Anything else (missing or
// "unknown") gets no tag.
function sourceLabel(source) {
  if (source === 'tci') return 'TCI';
  if (source === 'n1mm' || source === 'dxlog') return 'Logger';
  return '';
}

const TX_TITLE = 'Transmitting right now (live from the radio over TCI)';

// The [TX] chip's markup, or '' for every case that isn't "a TCI radio,
// online, keyed right now".
//
// Gated on source === 'tci' as well as the flag. The server already sends
// tx:false for the logger sources, so this is belt-and-braces -- but the
// point of the chip is that it means something definite, and the only
// source that can say "keyed" rather than "probably keyed" is the direct
// radio link. A future source that can't really tell shouldn't be able to
// light this up by sending a hopeful true.
function txChip(radio) {
  if (radio.status !== 'online' || radio.source !== 'tci' || !radio.tx) return '';
  return `<span class="tx-chip" title="${TX_TITLE}" role="status"` +
         ` aria-label="Transmitting">TX</span>`;
}

// The chip on a last-worked QSO. It names the route the QSO came in on --
// the agent's ADIF-over-UDP port, which is QRZero's "QSO logged"
// connection -- not a detection of which program sent it; an ADIF record
// doesn't say. Anything else gets no chip rather than a guess.
function lastWorkedChip(source) {
  if (source === 'qrzero') return 'QRZero Logged';
  return '';
}

// Date and time of the QSO, as UTC -- the two fields on their own, since
// that's what an operator reads off a log. Falls back to showing the raw
// string if it isn't a timestamp we can parse, rather than printing
// "Invalid Date".
function fmtQsoWhen(at) {
  const d = new Date(at);
  if (isNaN(d.getTime())) return { date: at || '', time: '' };
  const iso = d.toISOString();
  return { date: iso.slice(0, 10), time: iso.slice(11, 16) + 'Z' };
}

// Built with textContent rather than innerHTML: a callsign and mode come
// from an ADIF record off the shack LAN, which is the one thing on this
// page that isn't from our own config or N1MM.
function lastWorkedEl(lw) {
  const when = fmtQsoWhen(lw.at);
  const el = document.createElement('div');
  el.className = 'last-worked';

  const label = document.createElement('span');
  label.textContent = 'Last worked';
  el.appendChild(label);

  const call = document.createElement('span');
  call.className = 'lw-call';
  call.textContent = lw.call;
  el.appendChild(call);

  // Band, never a frequency: the agent masks a logged QSO's frequency the
  // way contest_mode masks a radio's, so a band name is all that reaches
  // the server (see agent/adif.go).
  if (lw.band) {
    const band = document.createElement('span');
    band.className = 'lw-band';
    band.textContent = lw.band;
    el.appendChild(band);
  }

  if (lw.mode) {
    const mode = document.createElement('span');
    mode.className = 'lw-mode';
    mode.textContent = lw.mode;
    el.appendChild(mode);
  }

  const chip = lastWorkedChip(lw.source);
  if (chip) {
    const tag = document.createElement('span');
    tag.className = 'source-tag';
    tag.textContent = chip;
    el.appendChild(tag);
  }

  const whenEl = document.createElement('span');
  whenEl.className = 'lw-when';
  whenEl.textContent = [when.date, when.time].filter(Boolean).join(' ');
  el.appendChild(whenEl);

  return el;
}

function render(data) {
  const content = document.getElementById('content');
  content.innerHTML = '';

  if (!data.stations || data.stations.length === 0) {
    const div = document.createElement('div');
    div.className = 'empty-state';
    div.textContent = 'No stations reporting yet.';
    content.appendChild(div);
    return;
  }

  let anyMasked = false;

  for (const station of data.stations) {
    const heading = document.createElement('div');
    heading.className = 'station-name';
    heading.textContent = station.station_name;
    content.appendChild(heading);

    const table = document.createElement('table');
    table.innerHTML = `
      <thead>
        <tr><th>Radio</th><th>Freq</th><th>Mode</th><th>Operator</th><th>Status</th></tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector('tbody');

    for (const radio of station.radios) {
      if (radio.status === 'online' && radio.band) anyMasked = true;
      const tr = document.createElement('tr');
      tr.className = radio.status; // "online" | "offline"
      tr.innerHTML = `
        <td data-label="Radio">${radio.label}${txChip(radio)}</td>
        <td data-label="Freq">${radio.status === 'online' ? fmtFreqCell(radio) : '\u2014'}</td>
        <td data-label="Mode">${radio.status === 'online' ? (radio.mode || '\u2014') : '\u2014'}</td>
        <td data-label="Operator">${radio.status === 'online' ? (radio.operator || '\u2014') : '\u2014'}</td>
        <td data-label="Status"><span class="status-pill ${radio.status}">${radio.status.toUpperCase()}</span>${sourceLabel(radio.source) ? `<span class="source-tag">${sourceLabel(radio.source)}</span>` : ''}</td>
      `;
      tbody.appendChild(tr);
    }
    content.appendChild(table);

    if (station.last_worked && station.last_worked.call) {
      content.appendChild(lastWorkedEl(station.last_worked));
    }
  }

  if (anyMasked) {
    const legend = document.createElement('div');
    legend.className = 'legend';
    legend.innerHTML = LOCK_SVG +
      ' Contest mode &mdash; exact frequency kept on the shack LAN';
    content.appendChild(legend);
  }

  // UTC ("Zulu"), the standard on-air time reference -- HH:MM:SSZ.
  document.getElementById('updated').textContent =
    'Last refreshed: ' + new Date().toISOString().slice(11, 19) + 'Z';
}

async function poll() {
  try {
    const res = await fetch('/api/status', { cache: 'no-store' });
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('content').textContent = 'Error loading status: ' + e;
  }
}

poll();
setInterval(poll, POLL_MS);

// Deploy stamp in the footer -- lets a viewer tell whether they're looking
// at a stale/cached page, since this only changes on an actual redeploy.
// Fetched once; no need to poll it.
fetch('/api/version', { cache: 'no-store' })
  .then((r) => r.json())
  .then((v) => {
    if (!v || !v.deployedAt) return;
    const d = new Date(v.deployedAt);
    if (isNaN(d.getTime())) return;
    // UTC ("Zulu"), matching the "Last refreshed" line above -- one
    // timezone across the whole page.
    const when = d.toISOString().slice(0, 19).replace('T', ' ') + 'Z';
    const el = document.getElementById('deploy-info');
    el.textContent = (v.version ? 'v' + v.version + ' \u00b7 ' : '') +
      'deployed ' + when + (v.commit ? ' (' + v.commit + ')' : '');
    el.hidden = false;
  })
  .catch(() => {});
</script>
</body>
</html>
